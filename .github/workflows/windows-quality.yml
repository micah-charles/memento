name: Windows quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        shell: pwsh
        run: dotnet restore .\Memento.slnx

      - name: Run repository quality gate
        shell: pwsh
        run: .\scripts\Verify-MementoAutomation.ps1 -SkipPreflight
